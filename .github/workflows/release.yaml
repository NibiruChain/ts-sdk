name: Semantic Release 🚀
on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    permissions:
      contents: write # publish GitHub release / push release commits
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - name: Checkout ts-sdk Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          submodules: true

      - name: Setup NodeJS and npm
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+ required for OIDC trusted publishing.
          # Do not set registry-url — it writes an .npmrc auth placeholder that breaks OIDC.
          node-version: "24"
          cache: "yarn"

      - name: yarn install
        uses: borales/actions-yarn@v4
        with:
          cmd: install

      - name: yarn build
        uses: borales/actions-yarn@v4
        with:
          cmd: build

      - name: yarn semantic-release
        uses: borales/actions-yarn@v4
        env:
          GITHUB_TOKEN: ${{ secrets.NIBIBOT_GIT_TOKEN }}
          # No NPM_TOKEN — publish authenticates via OIDC trusted publishing on npmjs.com.
          # Trusted publisher must name this workflow file exactly: release.yaml
        with:
          cmd: semantic-release
